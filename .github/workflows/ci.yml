name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: Frontend — lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install`, not `npm ci`: the lockfile is generated on macOS and npm
      # records only the host platform's optional binaries, so `npm ci` on Linux
      # fails with "Cannot find module @rollup/rollup-linux-x64-gnu".
      # See https://github.com/npm/cli/issues/4828
      - run: npm install --no-audit --no-fund
      - run: npm run lint --workspace frontend
      - run: npm run typecheck --workspace frontend
      - run: npm run test --workspace frontend
      - run: npm run build --workspace frontend

  backend:
    name: Backend — lint · test · e2e · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dacan
          POSTGRES_PASSWORD: dacan
          POSTGRES_DB: dacantour_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dacan -d dacantour_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: dacan
      POSTGRES_PASSWORD: dacan
      POSTGRES_DB: dacantour_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install`, not `npm ci`: the lockfile is generated on macOS and npm
      # records only the host platform's optional binaries, so `npm ci` on Linux
      # fails with "Cannot find module @rollup/rollup-linux-x64-gnu".
      # See https://github.com/npm/cli/issues/4828
      - run: npm install --no-audit --no-fund
      # `nest build` and ts-jest both type-check, so no separate lint/typecheck step.
      - run: npm run test --workspace backend
      - run: npm run test:e2e --workspace backend
      - run: npm run build --workspace backend

  e2e:
    name: Playwright — critical user journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install`, not `npm ci`: the lockfile is generated on macOS and npm
      # records only the host platform's optional binaries, so `npm ci` on Linux
      # fails with "Cannot find module @rollup/rollup-linux-x64-gnu".
      # See https://github.com/npm/cli/issues/4828
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --workspace frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Single required check to protect `main`: nothing merges unless all jobs pass.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [frontend, backend, e2e]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI jobs failed — blocking merge."
            exit 1
          fi
          echo "All checks green."
