# Local development stack for Dacan Tour.
#
#   docker compose -f infra/docker-compose.yml up --build
#
# Default services: postgres + directus + frontend.
# The backend API joins in Phase 2 — start it with:  --profile api
#
# Copy infra/.env.example -> infra/.env and fill values before running.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dacan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dacan}
      POSTGRES_DB: ${POSTGRES_DB:-dacantour}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dacan} -d ${POSTGRES_DB:-dacantour}"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY:-replace-me-key}
      SECRET: ${DIRECTUS_SECRET:-replace-me-secret}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-dacantour}
      DB_USER: ${POSTGRES_USER:-dacan}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dacan}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@dacantour.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-me}
      PUBLIC_URL: http://localhost:8055
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:3000"
    volumes:
      - directus_uploads:/directus/uploads
      - ../cms/snapshots:/directus/snapshots

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - directus
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-http://localhost:8055}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}

  # ----- Phase 2: NestJS API (start with `--profile api`) -----
  backend:
    profiles: ["api"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      RUNNING_IN_DOCKER: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-dacan}:${POSTGRES_PASSWORD:-dacan}@postgres:5432/${POSTGRES_DB:-dacantour}
      FRONTEND_ORIGIN: http://localhost:3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TEAM_INBOX: ${TEAM_INBOX:-hello@dacantour.com}

volumes:
  pgdata:
  directus_uploads:
